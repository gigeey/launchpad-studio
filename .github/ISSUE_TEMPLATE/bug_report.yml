name: Bug report
description: Something behaves differently from how it is documented or how it obviously should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The reproduction steps matter more than anything
        else here — a bug we can reproduce usually gets fixed, and one we cannot
        usually does not.

        **Do not report security vulnerabilities here.** Use the private channel
        described in [SECURITY.md](https://github.com/gigeey/launchpad-studio/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe? Paste exact error text rather than describing it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        Number them. If it only happens sometimes, say roughly how often and what
        seems to make it more likely — that is useful, not vague.
      placeholder: |
        1. Start the app with …
        2. Create an agent with …
        3. Send …
        4. Observe …
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it?
      options:
        - Built from source (cargo / npm run tauri dev)
        - Downloaded release build
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, or the output of `git rev-parse --short HEAD` for a source build.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15.2 (Apple Silicon)
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Model provider involved, if any
      description: Which provider and model. Never paste an API key.
      placeholder: Anthropic / claude-opus-5

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Paste any relevant output. **Check it for API keys, tokens, file paths you
        would rather not publish, and anything from a private repository before
        you post — issues are public and cannot be truly un-posted.**
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I have removed any secrets or private data from the text above
          required: true
